<mat-card class="card">
  <div class="header">
    <div>
      <h2>Scope 2.1 Purchased Electricity</h2>
      <div class="sub">Cycle ID: {{ cycleId }}</div>
    </div>
    <div class="header-actions">
      <button mat-stroked-button type="button" (click)="addRow()" [disabled]="loading || saving">
        <mat-icon>add</mat-icon>
        Add row
      </button>
      <button mat-raised-button color="primary" type="button" (click)="saveAndSync()" [disabled]="loading || saving">
        <mat-progress-spinner *ngIf="saving" diameter="18" mode="indeterminate"></mat-progress-spinner>
        <span>{{ saving ? 'Saving...' : 'Save & Sync' }}</span>
      </button>
    </div>
  </div>

  <mat-divider></mat-divider>

  <div class="empty" *ngIf="loading">Loading...</div>
  <div class="empty" *ngIf="!loading && error">{{ error }}</div>

  <div class="table-wrapper" *ngIf="!loading">
    <table class="monthly-table">
      <thead>
        <tr>
          <th rowspan="2">Meter/User</th>
          <th rowspan="2">Source</th>
          <th rowspan="2">Evidence</th>
          <th rowspan="2">Unit</th>
          <th rowspan="2">Total</th>
          <th [attr.colspan]="months.length">Monthly usage</th>
          <th rowspan="2"></th>
        </tr>
        <tr>
          <th *ngFor="let m of months">{{ m }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows">
          <td>
            <input type="text" [ngModel]="row.itemName" (ngModelChange)="updateText(row, 'itemName', $event)" />
          </td>
          <td>
            <input type="text" [ngModel]="row.remark" (ngModelChange)="updateText(row, 'remark', $event)" />
          </td>
          <td>
            <input type="text" [ngModel]="row.referenceText" (ngModelChange)="updateText(row, 'referenceText', $event)" />
          </td>
          <td>
            <input type="text" [ngModel]="row.unit" (ngModelChange)="updateText(row, 'unit', $event)" />
          </td>
          <td class="num">{{ total(row) | number: '1.0-2' }}</td>
          <td *ngFor="let m of months">
            <input type="number" [ngModel]="getMonthQty(row, m)" (ngModelChange)="updateMonthQty(row, m, $event)" />
          </td>
          <td>
            <button mat-icon-button type="button" color="warn" (click)="removeRow(row)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <app-evidence-block
    evidenceKey="S2::2.1"
    [model]="evidenceModel"
    (modelChange)="onEvidenceChange($event)"
  ></app-evidence-block>
</mat-card>
