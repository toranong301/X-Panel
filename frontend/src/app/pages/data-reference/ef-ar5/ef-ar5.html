<mat-card class="reference-card">
  <div class="controls">
    <mat-form-field appearance="outline">
      <mat-label>Scope</mat-label>
      <mat-select [(value)]="scope" (selectionChange)="onScopeChange()">
        <mat-option value="stationary">Stationary</mat-option>
        <mat-option value="mobile">Mobile</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-progress-spinner *ngIf="loading" diameter="28" mode="indeterminate"></mat-progress-spinner>
  </div>

  <div class="warning" *ngIf="warning">{{ warning }}</div>

  <table mat-table [dataSource]="options" class="ef-table" *ngIf="!loading && options.length">
    <ng-container *ngFor="let column of columns" [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
      <td mat-cell *matCellDef="let element">{{ element[column] ?? '-' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>

  <div class="empty" *ngIf="!loading && options.length === 0">No EF catalog entries available.</div>
</mat-card>
