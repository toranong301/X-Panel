<aside class="sidebar" *ngIf="hasCycle(); else emptyState">
  <ng-container *ngFor="let item of menuItems()">
    <ng-container *ngIf="item.children?.length; else singleLink">
      <div class="group-label">{{ item.label }}</div>
      <ng-container *ngFor="let child of item.children">
        <ng-container *ngIf="child.children?.length; else siblingLink">
          <div class="group-label group-label--nested">{{ child.label }}</div>
          <ng-container *ngFor="let grandchild of child.children">
            <a
              class="sidebar-link sidebar-link--nested"
              [routerLink]="linkPath(grandchild.path)"
              routerLinkActive="active"
            >
              {{ grandchild.label }}
            </a>
          </ng-container>
        </ng-container>
        <ng-template #siblingLink>
          <a
            class="sidebar-link"
            [routerLink]="linkPath(child.path)"
            routerLinkActive="active"
          >
            {{ child.label }}
          </a>
        </ng-template>
      </ng-container>
    </ng-container>
    <ng-template #singleLink>
      <a
        class="sidebar-link"
        [routerLink]="linkPath(item.path)"
        routerLinkActive="active"
      >
        {{ item.label }}
      </a>
    </ng-template>
  </ng-container>
</aside>

<ng-template #emptyState>
  <aside class="sidebar sidebar--empty">
    <p>Choose a cycle to see navigation.</p>
  </aside>
</ng-template>
